# ============================================================================
# Scientific Pathfinder — Development Docker Compose
# ============================================================================
# Usage:
#   docker-compose up -d          # Start all services
#   docker-compose logs -f        # View logs
#   docker-compose down           # Stop all services
#   docker-compose down -v        # Stop and remove volumes
# ============================================================================

services:
  # ── Neo4j Database ──────────────────────────────────────────────────
  neo4j:
    image: neo4j:5-community
    container_name: sp-neo4j
    ports:
      - "7474:7474"   # Browser UI
      - "7687:7687"   # Bolt protocol
    environment:
      NEO4J_AUTH: neo4j/devpassword123
      NEO4J_PLUGINS: '[]'
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - sp-network

  # ── Backend API ─────────────────────────────────────────────────────
  backend:
    build:
      context: ./scientific_pathfinder
      dockerfile: Dockerfile
    container_name: sp-backend
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: development
      DEBUG: "true"
      LOG_LEVEL: DEBUG
      LOG_FORMAT: text
      CORS_ORIGINS: "http://localhost:3000,http://localhost:5173"
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: devpassword123
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.1-8b-instant}
      SEMANTIC_SCHOLAR_API_KEY: ${SEMANTIC_SCHOLAR_API_KEY:-}
    depends_on:
      neo4j:
        condition: service_healthy
    networks:
      - sp-network
    restart: unless-stopped

  # ── Frontend ────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./scientific_pathfinder_frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
    container_name: sp-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - sp-network
    restart: unless-stopped

volumes:
  neo4j_data:
  neo4j_logs:

networks:
  sp-network:
    driver: bridge
