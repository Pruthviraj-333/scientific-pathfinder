name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  # ═══════════════════════════════════════════════════════════════════
  #  Backend CI
  # ═══════════════════════════════════════════════════════════════════
  backend-lint:
    name: "Backend: Lint"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scientific_pathfinder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install ruff
      - run: ruff check . --output-format=github

  backend-test:
    name: "Backend: Test"
    runs-on: ubuntu-latest
    needs: backend-lint
    defaults:
      run:
        working-directory: scientific_pathfinder
    env:
      ENVIRONMENT: development
      GROQ_API_KEY: test_key
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: testpassword
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: scientific_pathfinder/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest tests/ -v --tb=short

  backend-docker:
    name: "Backend: Docker Build"
    runs-on: ubuntu-latest
    needs: backend-test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t sp-backend:${{ github.sha }} ./scientific_pathfinder

  # ═══════════════════════════════════════════════════════════════════
  #  Frontend CI
  # ═══════════════════════════════════════════════════════════════════
  frontend-lint:
    name: "Frontend: Lint & Type Check"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scientific_pathfinder_frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: scientific_pathfinder_frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit

  frontend-build:
    name: "Frontend: Build"
    runs-on: ubuntu-latest
    needs: frontend-lint
    defaults:
      run:
        working-directory: scientific_pathfinder_frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: scientific_pathfinder_frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_URL: https://api.example.com

  frontend-docker:
    name: "Frontend: Docker Build"
    runs-on: ubuntu-latest
    needs: frontend-build
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t sp-frontend:${{ github.sha }} ./scientific_pathfinder_frontend

  # ═══════════════════════════════════════════════════════════════════
  #  Docker Compose Validation
  # ═══════════════════════════════════════════════════════════════════
  compose-validate:
    name: "Docker Compose: Validate"
    runs-on: ubuntu-latest
    needs: [backend-docker, frontend-docker]
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose files
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.prod.yml config --quiet
